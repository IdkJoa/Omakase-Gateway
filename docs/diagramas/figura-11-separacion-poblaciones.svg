<rect x="130" y="530" width="1300" height="116" fill="#F2F6FB" stroke="#4472A8" stroke-width="1.4" rx="4" stroke-dasharray="7 4"/>
<text x="780.0" y="554" font-family="'Segoe UI', 'Calibri', Arial, sans-serif" font-size="14" font-weight="600" fill="#1F3864" text-anchor="middle"></text>
<text x="160" y="562" font-family="'Segoe UI', 'Calibri', Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6472" text-anchor="start">El umbral de desafio se situo en 33 por ser el punto medio del hueco entre la poblacion legitima y la anomala, no por conveniencia:</text>
<text x="160" y="584" font-family="'Segoe UI', 'Calibri', Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6472" text-anchor="start">deja aproximadamente 4,75 puntos de margen a cada lado. El de bloqueo bajo de 75 a 70 porque, con los pesos igualados, una violacion</text>
<text x="160" y="606" font-family="'Segoe UI', 'Calibri', Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6472" text-anchor="start">determinista al 100 % con anomalia neutra da exactamente 75,00 —el borde exacto— y quedaba degradada a desafio. Una regla determinista</text>
<text x="160" y="628" font-family="'Segoe UI', 'Calibri', Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6472" text-anchor="start">que dispara no es una probabilidad sino una certeza, de modo que debe denegar.</text>
</svg>
