<text x="230" y="772" font-family="'Segoe UI', 'Calibri', Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6472" text-anchor="start">201.217 evaluaciones con 100 usuarios virtuales concurrentes durante cinco minutos, a 558,9 peticiones por segundo,</text>
